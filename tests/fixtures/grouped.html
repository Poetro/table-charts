<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Grouped Bars</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Grouped Sales</h1>
    <table-bar-chart>
      <table>
        <caption>
          Quarterly Sales
        </caption>
        <thead>
          <tr>
            <th>Product</th>
            <th>Online</th>
            <th>Retail</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Product A</td>
            <td>1200</td>
            <td>800</td>
          </tr>
          <tr>
            <td>Product B</td>
            <td>900</td>
            <td>600</td>
          </tr>
          <tr>
            <td>Product C</td>
            <td>1500</td>
            <td>400</td>
          </tr>
        </tbody>
      </table>
    </table-bar-chart>
    <script type="module" src="../../dist/table-bar-chart.js"></script>
  </body>
</html>
