<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stacked Bars</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .bar.stacked {
        display: flex;
        flex-direction: column-reverse;
        width: 100%;
      }
      .stack-segment {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Stacked Revenue</h1>
    <table-bar-chart stacked>
      <table>
        <caption>
          Revenue Breakdown
        </caption>
        <thead>
          <tr>
            <th>Region</th>
            <th>Product</th>
            <th>Service</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>North</td>
            <td>300</td>
            <td>200</td>
          </tr>
          <tr>
            <td>South</td>
            <td>150</td>
            <td>50</td>
          </tr>
          <tr>
            <td>East</td>
            <td>400</td>
            <td>100</td>
          </tr>
        </tbody>
      </table>
    </table-bar-chart>
    <script type="module" src="../../dist/table-bar-chart.js"></script>
  </body>
</html>
